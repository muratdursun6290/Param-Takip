<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<title>Para Takip</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f1;--card:#fff;--ink:#1d2a24;--mute:#6b7a72;--line:#dfe5e0;
  --gelir:#1f7a4d;--gider:#b3402f;--birikim:#2a6fb0;--accent:#1f4d3a;--onaccent:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815;--card:#1b2420;--ink:#e8efe9;--mute:#93a39a;--line:#2b3832;
  --gelir:#58c98d;--gider:#ee8a78;--birikim:#7db8f2;--accent:#58c98d;--onaccent:#0e1a14;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:16px 16px 100px}
.sayfa{display:none}.sayfa.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;padding:10px 4px 8px;border:0;background:none;color:var(--mute);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
.bilgi{color:var(--mute);font-size:14px;margin:0 0 10px}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:15px;margin:0 0 8px}
.kutu{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.aralik{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aralik label{font-size:13px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chips button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:14px}
.chips button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.bakiye{font-size:32px;font-weight:700;letter-spacing:-.5px}
.alt{display:flex;gap:16px;margin-top:8px;font-size:15px;flex-wrap:wrap}
.g{color:var(--gelir)}.x{color:var(--gider)}.b{color:var(--birikim)}
.toplamB{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:15px}
.tur{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tur button{padding:12px 4px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font-size:16px;font-weight:600}
.tur button.on.gider{border-color:var(--gider);color:var(--gider)}
.tur button.on.gelir{border-color:var(--gelir);color:var(--gelir)}
.tur button.on.birikim{border-color:var(--birikim);color:var(--birikim)}
input,select{width:100%;padding:12px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.aralik input{margin-bottom:0}
.ekle{width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--onaccent);font-size:16px;font-weight:700}
.sekme{display:flex;gap:6px;margin-bottom:12px}
.sekme button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.sekme button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.det{margin-bottom:14px}
.dsat{margin-bottom:10px}
.dsat .ust{display:flex;justify-content:space-between;font-size:15px}
.cubuk{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.cubuk i{display:block;height:100%;border-radius:3px}
.sat{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.sat:last-child{border-bottom:0}
.sat .m{flex:1;min-width:0}
.sat .m div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sat small{color:var(--mute)}
.sat .t{font-weight:700;white-space:nowrap}
.sil{background:none;border:0;color:var(--mute);font-size:20px;width:36px;height:36px}
.bos{padding:16px;text-align:center;color:var(--mute)}
.yedek summary{color:var(--mute);padding:8px 0}
.yedek button{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:0 6px 8px 0}
textarea{width:100%;height:90px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:8px}
.perde{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.perde[hidden]{display:none}
.duzKutu{width:100%;max-width:560px;margin:0;border-radius:14px 14px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.duzAlt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.duzAlt button{padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:600}
.duzAlt .ekle{border:0}
.duzSil{width:100%;margin-top:8px;padding:12px;border-radius:10px;border:1px solid var(--gider);background:transparent;color:var(--gider);font-size:15px}
.sat .m{cursor:pointer}
</style>
</head>
<body>
<h1 id="baslik">Para Takip</h1>

<!-- SAYFA 1: VERİ GİRİŞİ -->
<section class="sayfa on" id="s-giris">
<div class="kutu">
  <div class="tur">
    <button class="gider on" id="bgider" onclick="turSec('gider')">Gider</button>
    <button class="gelir" id="bgelir" onclick="turSec('gelir')">Gelir</button>
    <button class="birikim" id="bbirikim" onclick="turSec('birikim')">Birikim</button>
  </div>
  <input id="tutar" type="number" inputmode="decimal" placeholder="Tutar (₺)">
  <select id="kat" aria-label="Kategori"></select>
  <input id="not" type="text" placeholder="Not (isteğe bağlı)">
  <input id="tarih" type="date" aria-label="Tarih">
  <button class="ekle" onclick="ekle()">Kaydet</button>
  <div id="mesaj" class="bilgi" style="margin:10px 0 0"></div>
</div>
<div class="kutu"><h2>Son girilenler</h2><div id="son"></div></div>
<details class="kutu yedek">
  <summary>Yedekle / geri yükle</summary>
  <button onclick="yedekAl()">Yedeği kopyala</button>
  <button onclick="yedekYukle()">Yapıştırılanı yükle</button>
  <p class="bilgi" id="durum"></p>
  <textarea id="yedekAlan" placeholder="Yedek metni burada görünür. Geri yüklemek için buraya yapıştırın."></textarea>
</details>
</section>

<!-- SAYFA 2: FİLTRE VE ÖZET -->
<section class="sayfa" id="s-filtre">
<div class="kutu">
  <h2>Tarih aralığı</h2>
  <div class="aralik">
    <div><label for="bas">Başlangıç</label><input id="bas" type="date" onchange="elleAralik()"></div>
    <div><label for="bit">Bitiş</label><input id="bit" type="date" onchange="elleAralik()"></div>
  </div>
  <div class="chips" id="chips">
    <button data-h="buay" onclick="hizli('buay')">Bu ay</button>
    <button data-h="gecen" onclick="hizli('gecen')">Geçen ay</button>
    <button data-h="3ay" onclick="hizli('3ay')">Son 3 ay</button>
    <button data-h="yil" onclick="hizli('yil')">Bu yıl</button>
    <button data-h="tum" onclick="hizli('tum')">Tümü</button>
  </div>
</div>
<div class="kutu">
  <small style="color:var(--mute)">Kalan (gelir − gider − birikim)</small>
  <div class="bakiye" id="bakiye">0 ₺</div>
  <div class="alt"><span class="g">Gelir <b id="gelir">0 ₺</b></span><span class="x">Gider <b id="gider">0 ₺</b></span><span class="b">Birikim <b id="birikim">0 ₺</b></span></div>
  <div class="toplamB b">Toplam birikimim (tüm zamanlar): <b id="topB">0 ₺</b></div>
</div>
<button class="ekle" onclick="git('detay')">Seçilen aralığın detaylarını gör →</button>
</section>

<!-- SAYFA 3: DETAYLAR -->
<section class="sayfa" id="s-detay">
<p class="bilgi" id="aralikYazi"></p>
<input id="araKutu" type="search" placeholder="🔍 Ara: kategori, not, tutar, tarih…" oninput="ara=this.value;ciz()" autocomplete="off">
<div class="sekme" id="sekme">
  <button data-s="tum" onclick="sekmeSec('tum')">Tümü</button>
  <button data-s="gelir" onclick="sekmeSec('gelir')">Gelirler</button>
  <button data-s="gider" onclick="sekmeSec('gider')">Giderler</button>
  <button data-s="birikim" onclick="sekmeSec('birikim')">Birikim</button>
</div>
<div id="detay"></div>
<div class="kutu" id="liste"></div>
</section>

<div class="perde" id="duzPerde" hidden onclick="if(event.target===this)duzKapat()">
  <div class="kutu duzKutu">
    <h2>Kaydı düzenle</h2>
    <div class="tur">
      <button class="gider" id="dgider" onclick="dTur('gider')">Gider</button>
      <button class="gelir" id="dgelir" onclick="dTur('gelir')">Gelir</button>
      <button class="birikim" id="dbirikim" onclick="dTur('birikim')">Birikim</button>
    </div>
    <input id="dtutar" type="number" inputmode="decimal" placeholder="Tutar (₺)">
    <select id="dkat" aria-label="Kategori"></select>
    <input id="dnot" type="text" placeholder="Not (isteğe bağlı)">
    <input id="dtarih" type="date" aria-label="Tarih">
    <div class="duzAlt"><button onclick="duzKapat()">Vazgeç</button><button class="ekle" onclick="duzKaydet()">Kaydet</button></div>
    <button class="duzSil" onclick="duzSil()">Bu kaydı sil</button>
  </div>
</div>

<nav>
  <button data-p="giris" class="on" onclick="git('giris')"><span>➕</span>Ekle</button>
  <button data-p="filtre" onclick="git('filtre')"><span>📅</span>Filtre</button>
  <button data-p="detay" onclick="git('detay')"><span>📊</span>Detay</button>
</nav>

<script>
const KAT={gider:["Market","Fatura","Kira","Ulaşım","Yemek","Sağlık","Alışveriş","Eğlence","Diğer"],gelir:["Maaş","Ek gelir","Diğer"],birikim:["Altın","Döviz","Vadeli hesap","Acil durum","Diğer"]};
const AD={gelir:"Gelir",gider:"Gider",birikim:"Birikim"};
const SIGN={gelir:"+",gider:"−",birikim:"→ "};
const $=id=>document.getElementById(id);
const tl=n=>n.toLocaleString("tr-TR",{minimumFractionDigits:0,maximumFractionDigits:2})+" ₺";
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
let tur="gider",sekme="tum",ara="",kayitlar=[];
const kucuk=t=>String(t).toLocaleLowerCase("tr");
function eslesir(k,q){if(!q)return true;
  const tarihYazi=new Date(k.tarih+"T00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
  const samanlik=kucuk([k.kat,k.not,AD[k.tur],k.tutar,tl(k.tutar),tarihYazi,k.tarih].join(" "));
  return kucuk(q).trim().split(/\s+/).every(p=>samanlik.includes(p))}
const BASLIK={giris:"Kayıt ekle",filtre:"Filtre ve özet",detay:"Detaylar"};
function git(p){document.querySelectorAll(".sayfa").forEach(x=>x.classList.toggle("on",x.id=="s-"+p));
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.p==p));
  $("baslik").textContent=BASLIK[p];window.scrollTo(0,0);ciz()}
try{kayitlar=JSON.parse(localStorage.getItem("paraTakip")||"[]")}catch(e){kayitlar=[]}
function kaydet(){try{localStorage.setItem("paraTakip",JSON.stringify(kayitlar))}catch(e){}}

function turSec(t){tur=t;["gider","gelir","birikim"].forEach(x=>$("b"+x).classList.toggle("on",x==t));
  $("kat").innerHTML=KAT[t].map(k=>`<option>${k}</option>`).join("")}
function sekmeSec(s){sekme=s;ciz()}

function hizli(h){
  const n=new Date(),y=n.getFullYear(),a=n.getMonth();let b="",s="";
  if(h=="buay"){b=iso(new Date(y,a,1));s=iso(new Date(y,a+1,0))}
  else if(h=="gecen"){b=iso(new Date(y,a-1,1));s=iso(new Date(y,a,0))}
  else if(h=="3ay"){b=iso(new Date(y,a-2,1));s=iso(new Date(y,a+1,0))}
  else if(h=="yil"){b=iso(new Date(y,0,1));s=iso(new Date(y,11,31))}
  $("bas").value=b;$("bit").value=s;$("chips").dataset.aktif=h;ciz()}
function elleAralik(){$("chips").dataset.aktif="";ciz()}

function ekle(){
  const t=parseFloat($("tutar").value.replace(",","."));
  if(!(t>0)){$("tutar").focus();return}
  const tarih=$("tarih").value||iso(new Date());
  kayitlar.push({id:Date.now(),tur,tutar:t,kat:$("kat").value,not:$("not").value.trim(),tarih});
  kaydet();$("tutar").value="";$("not").value="";
  $("mesaj").textContent="✓ Kaydedildi: "+AD[tur]+" "+tl(t);ciz()}
let duzId=null,dturu="gider";
function duzenle(id){const k=kayitlar.find(x=>x.id===id);if(!k)return;duzId=id;
  $("dtutar").value=k.tutar;$("dnot").value=k.not||"";$("dtarih").value=k.tarih;dTur(k.tur,k.kat);$("duzPerde").hidden=false}
function dTur(t,kat){dturu=t;["gider","gelir","birikim"].forEach(x=>$("d"+x).classList.toggle("on",x==t));
  const l=KAT[t].slice();if(kat&&!l.includes(kat))l.push(kat);
  $("dkat").innerHTML=l.map(c=>`<option>${esc(c)}</option>`).join("");$("dkat").value=kat||l[0]}
function duzKaydet(){const t=parseFloat(String($("dtutar").value).replace(",","."));
  if(!(t>0)){$("dtutar").focus();return}
  const k=kayitlar.find(x=>x.id===duzId);if(!k){duzKapat();return}
  k.tur=dturu;k.tutar=t;k.kat=$("dkat").value;k.not=$("dnot").value.trim();k.tarih=$("dtarih").value||k.tarih;
  kaydet();duzKapat();ciz()}
function duzKapat(){$("duzPerde").hidden=true;duzId=null}
function duzSil(){if(duzId!==null&&confirm("Bu kayıt silinsin mi?")){kayitlar=kayitlar.filter(k=>k.id!==duzId);kaydet();duzKapat();ciz()}}
function sil(id){if(confirm("Bu kayıt silinsin mi?")){kayitlar=kayitlar.filter(k=>k.id!==id);kaydet();ciz()}}

function topla(l,t){return l.filter(k=>k.tur==t).reduce((s,k)=>s+k.tutar,0)}
function renk(t){return `var(--${t})`}
function kirilim(l,t){
  const top=topla(l,t);
  const m={};l.filter(k=>k.tur==t).forEach(k=>m[k.kat]=(m[k.kat]||0)+k.tutar);
  const sirali=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  const govde=sirali.length?sirali.map(([ad,v])=>`<div class="dsat"><div class="ust"><span>${esc(ad)}</span><span><b>${tl(v)}</b> <small style="color:var(--mute)">%${Math.round(v/top*100)}</small></span></div><div class="cubuk"><i style="width:${v/top*100}%;background:${renk(t)}"></i></div></div>`).join(""):'<div class="bos">Bu aralıkta kayıt yok.</div>';
  return `<div class="kutu det"><h2 class="${t=="gelir"?"g":t=="gider"?"x":"b"}">${AD[t]} detayı · ${tl(top)}</h2>${govde}</div>`}

function aralikYazisi(b,s){const f=d=>new Date(d+"T00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
  return b||s?(b?f(b):"başlangıç")+" – "+(s?f(s):"bugün"):"Tüm zamanlar"}
function satir(k,etiket){return `<div class="sat"><div class="m" onclick="duzenle(${k.id})"><div>${esc(k.kat)}${k.not?" · "+esc(k.not):""}</div><small>${new Date(k.tarih+"T00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"})}${etiket?" · "+AD[k.tur]:""}</small></div><div class="t ${k.tur=="gelir"?"g":k.tur=="gider"?"x":"b"}">${SIGN[k.tur]}${tl(k.tutar)}</div><button class="sil" onclick="duzenle(${k.id})" aria-label="Düzenle">✎</button><button class="sil" onclick="sil(${k.id})" aria-label="Sil">✕</button></div>`}
function ciz(){
  const b=$("bas").value,s=$("bit").value;
  document.querySelectorAll("#chips button").forEach(x=>x.classList.toggle("on",x.dataset.h==$("chips").dataset.aktif));
  document.querySelectorAll("#sekme button").forEach(x=>x.classList.toggle("on",x.dataset.s==sekme));
  const l=kayitlar.filter(k=>(!b||k.tarih>=b)&&(!s||k.tarih<=s)).sort((a,c)=>c.tarih.localeCompare(a.tarih)||c.id-a.id);
  const g=topla(l,"gelir"),x=topla(l,"gider"),bi=topla(l,"birikim");
  $("gelir").textContent=tl(g);$("gider").textContent=tl(x);$("birikim").textContent=tl(bi);
  $("bakiye").textContent=tl(g-x-bi);$("topB").textContent=tl(topla(kayitlar,"birikim"));
  const turler=sekme=="tum"?["gelir","gider","birikim"]:[sekme];
  const lf=l.filter(k=>eslesir(k,ara));
  $("detay").innerHTML=turler.map(t=>kirilim(lf,t)).join("");
  const ls=sekme=="tum"?lf:lf.filter(k=>k.tur==sekme);
  $("liste").innerHTML=`<h2>Kayıtlar (${ls.length})</h2>`+(ls.length?ls.map(k=>satir(k,sekme=="tum")).join(""):'<div class="bos">'+(ara?"Aramanızla eşleşen kayıt yok.":"Bu aralıkta kayıt yok. Filtre sayfasından aralığı değiştirebilirsiniz.")+'</div>');
  $("aralikYazi").textContent="Aralık: "+aralikYazisi(b,s);
  const son=[...kayitlar].sort((a,c)=>c.id-a.id).slice(0,5);
  $("son").innerHTML=son.length?son.map(k=>satir(k,true)).join(""):'<div class="bos">Henüz kayıt yok.</div>'}

async function yedekAl(){const v=JSON.stringify(kayitlar);$("yedekAlan").value=v;
  try{await navigator.clipboard.writeText(v);alert("Yedek kopyalandı. Bir nota veya e-postaya yapıştırıp saklayın.")}catch(e){$("yedekAlan").select()}}
function yedekYukle(){try{const a=JSON.parse($("yedekAlan").value);if(!Array.isArray(a))throw 0;
  if(confirm(a.length+" kayıt yüklenecek, mevcut kayıtların yerine geçer. Devam?")){kayitlar=a;kaydet();ciz()}}catch(e){alert("Yedek metni geçersiz.")}}

$("tarih").value=iso(new Date());turSec("gider");hizli("buay");
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  navigator.serviceWorker.ready.then(()=>{$("durum").textContent="✓ Çevrimdışı kullanıma hazır"}).catch(()=>{});
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
</body>
</html>
